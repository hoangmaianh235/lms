<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 24: Xưởng chế tạo Robot</title>
    <style>
        :root { --primary: #7209B7; --success: #4CC9F0; --danger: #F72585; --bg: #2B2D42; --card: #3D405B; --text: #FFFFFF; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--primary); color: white; padding: 1.5rem; text-align: center; }
        .container { max-width: 700px; margin: 2rem auto; padding: 0 1rem; width: 100%; }
        .game-window { background: var(--card); border-radius: 20px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .rounds-stepper { display: flex; gap: 10px; margin-bottom: 2rem; }
        .step-pill { flex: 1; background: #8D99AE; text-align: center; padding: 10px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; color: #2B2D42; }
        .step-pill.active { background: var(--primary); color: white; }
        .step-pill.completed { background: var(--success); color: #2B2D42; }
        .question-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; line-height: 1.5; }
        .options-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options-list { grid-template-columns: 1fr; } }
        .btn-option { background: #2B2D42; border: 2px solid transparent; padding: 1rem; border-radius: 12px; font-size: 0.95rem; font-weight: 600; color: white; cursor: pointer; text-align: left; }
        .btn-option:hover { border-color: var(--success); background: #4A4E69; }
        .alert-box { margin-top: 1.5rem; padding: 1rem; border-radius: 12px; display: none; font-weight: 600; }
        .alert-box.correct { background: #4CC9F0; color: #2B2D42; }
        .alert-box.wrong { background: #F72585; color: white; }
        .btn-next { margin-top: 1.5rem; background: var(--success); color: #2B2D42; border: none; padding: 12px 24px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; display: none; float: right; }
    </style>
</head>
<body>
    <header>
        <h1>Bài 24: XƯỞNG CHẾ TẠO ROBOT</h1>
        <p>Môn: Toán 3 - Kết nối tri thức với cuộc sống</p>
    </header>
    <div class="container">
        <div class="game-window">
            <div class="rounds-stepper">
                <div id="pill-0" class="step-pill active">Vòng 1: Khởi động</div>
                <div id="pill-1" class="step-pill">Vòng 2: Vượt chướng</div>
                <div id="pill-2" class="step-pill">Vòng 3: Về đích</div>
            </div>
            <div class="question-title" id="q-title"></div>
            <div class="options-list" id="opts-container"></div>
            <div id="result-alert" class="alert-box"></div>
            <div style="overflow: hidden;">
                <button id="btn-continue" class="btn-next" onclick="nextRound()">Tiếp tục ►</button>
            </div>
        </div>
    </div>
    <script>
        const rounds = [
            { title: "Vòng 1: Pin có 7 đơn vị năng lượng, khi qua máy 'gấp 4 lần' ta chọn phép tính nào?", options: ["A. 7 + 4 = 11", "B. 7 - 4 = 3", "C. 7 × 4 = 28", "D. 7 ÷ 4"], ans: 2 },
            { title: "Vòng 2: Có 9 bánh răng, sau khi gấp lên 3 lần sẽ thu được bao nhiêu bánh răng?", options: ["A. 12 bánh răng", "B. 27 bánh răng", "C. 18 bánh răng", "D. 24 bánh răng"], ans: 1 },
            { title: "Vòng 3: Robot A làm được 9 linh kiện, Robot B làm gấp 4 lần Robot A. Hỏi CẢ HAI Robot làm bao nhiêu linh kiện?", options: ["A. 36 linh kiện", "B. 45 linh kiện", "C. 13 linh kiện", "D. 40 linh kiện"], ans: 1 }
        ];
        let currentRound = 0;
        function renderRound() {
            for (let i = 0; i < 3; i++) {
                const pill = document.getElementById(`pill-${i}`);
                pill.className = 'step-pill' + (i < currentRound ? ' completed' : i === currentRound ? ' active' : '');
            }
            const data = rounds[currentRound];
            document.getElementById('q-title').innerText = data.title;
            const optsBox = document.getElementById('opts-container');
            optsBox.innerHTML = '';
            document.getElementById('result-alert').style.display = 'none';
            document.getElementById('btn-continue').style.display = 'none';
            data.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = optText;
                btn.onclick = () => processAnswer(index);
                optsBox.appendChild(btn);
            });
        }
        function processAnswer(choice) {
            const data = rounds[currentRound];
            const alertBox = document.getElementById('result-alert');
            document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
            if (choice === data.ans) {
                alertBox.className = 'alert-box correct';
                alertBox.innerText = '🎉 Chính xác! Công suất đã được nhân gấp lên.';
            } else {
                alertBox.className = 'alert-box wrong';
                alertBox.innerText = '❌ Chưa chính xác! Đáp án đúng là: ' + data.options[data.ans];
            }
            alertBox.style.display = 'block';
            document.getElementById('btn-continue').style.display = 'block';
        }
        function nextRound() {
            currentRound++;
            if (currentRound < 3) renderRound();
            else { alert('🏆 Chúc mừng bạn đã hoàn thành lắp ráp Robot siêu cấp!'); location.reload(); }
        }
        renderRound();
    </script>
</body>
</html>
