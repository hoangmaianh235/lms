<!DOCTYPE html>
<lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 13: Cảnh sát vũ trụ - Truy bắt ẩn số</title>
    <style>
        :root { --primary: #4361EE; --success: #2EC4B6; --danger: #E63946; --bg: #0B132B; --card: #1C2541; --text: #FFFFFF; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #1C2541; border-bottom: 2px solid var(--primary); color: white; padding: 1.5rem; text-align: center; }
        .container { max-width: 700px; margin: 2rem auto; padding: 0 1rem; width: 100%; }
        .game-window { background: var(--card); border-radius: 20px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .rounds-stepper { display: flex; gap: 10px; margin-bottom: 2rem; }
        .step-pill { flex: 1; background: #3A506B; text-align: center; padding: 10px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; color: #8D99AE; }
        .step-pill.active { background: var(--primary); color: white; }
        .step-pill.completed { background: var(--success); color: white; }
        .question-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; line-height: 1.5; }
        .options-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options-list { grid-template-columns: 1fr; } }
        .btn-option { background: #3A506B; border: 2px solid transparent; padding: 1rem; border-radius: 12px; font-size: 0.95rem; font-weight: 600; color: white; cursor: pointer; text-align: left; }
        .btn-option:hover { border-color: var(--primary); background: #5BC0BE; color: #0B132B; }
        .alert-box { margin-top: 1.5rem; padding: 1rem; border-radius: 12px; display: none; font-weight: 600; }
        .alert-box.correct { background: #17C3B2; color: #0B132B; }
        .alert-box.wrong { background: #FE6D73; color: #0B132B; }
        .btn-next { margin-top: 1.5rem; background: var(--success); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; display: none; float: right; }
    </style>
</head>
<body>
    <header>
        <h1>Bài 13: CẢNH SÁT VŨ TRỤ - TRUY BẮT ẨN SỐ</h1>
        <p>Môn: Toán 3 - Kết nối tri thức với cuộc sống</p>
    </header>
    <div class="container">
        <div class="game-window">
            <div class="rounds-stepper">
                <div id="pill-0" class="step-pill active">Vòng 1: Khởi động</div>
                <div id="pill-1" class="step-pill">Vòng 2: Vượt chướng</div>
                <div id="pill-2" class="step-pill">Vòng 3: Về đích</div>
            </div>
            <div class="question-title" id="q-title"></div>
            <div class="options-list" id="opts-container"></div>
            <div id="result-alert" class="alert-box"></div>
            <div style="overflow: hidden;">
                <button id="btn-continue" class="btn-next" onclick="nextRound()">Tiếp tục ►</button>
            </div>
        </div>
    </div>
    <script>
        const rounds = [
            { title: "Vòng 1: Cho phép tính 'X ÷ 8 = 7'. Thành phần X được gọi là gì?", options: ["A. Số chia", "B. Số bị chia", "C. Thương", "D. Thừa số"], ans: 1 },
            { title: "Vòng 2: Kích hoạt radar tìm ẩn số X, biết: 32 ÷ X = 4", options: ["A. X = 6", "B. X = 7", "C. X = 8", "D. X = 9"], ans: 2 },
            { title: "Vòng 3: Đội đóng 48 viên năng lượng vào X khoang, mỗi khoang chứa 8 viên thì vừa đủ. Tìm X:", options: ["A. X = 6 khoang", "B. X = 7 khoang", "C. X = 8 khoang", "D. X = 9 khoang"], ans: 0 }
        ];
        let currentRound = 0;
        function renderRound() {
            for (let i = 0; i < 3; i++) {
                const pill = document.getElementById(`pill-${i}`);
                pill.className = 'step-pill' + (i < currentRound ? ' completed' : i === currentRound ? ' active' : '');
            }
            const data = rounds[currentRound];
            document.getElementById('q-title').innerText = data.title;
            const optsBox = document.getElementById('opts-container');
            optsBox.innerHTML = '';
            document.getElementById('result-alert').style.display = 'none';
            document.getElementById('btn-continue').style.display = 'none';
            data.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = optText;
                btn.onclick = () => processAnswer(index);
                optsBox.appendChild(btn);
            });
        }
        function processAnswer(choice) {
            const data = rounds[currentRound];
            const alertBox = document.getElementById('result-alert');
            document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
            if (choice === data.ans) {
                alertBox.className = 'alert-box correct';
                alertBox.innerText = '🎉 Chính xác! Tên lửa đã được kích hoạt.';
            } else {
                alertBox.className = 'alert-box wrong';
                alertBox.innerText = '❌ Chưa chính xác! Đáp án đúng là: ' + data.options[data.ans];
            }
            alertBox.style.display = 'block';
            document.getElementById('btn-continue').style.display = 'block';
        }
        function nextRound() {
            currentRound++;
            if (currentRound < 3) renderRound();
            else { alert('🏆 Chúc mừng Cảnh sát vũ trụ đã bắt được ẩn số!'); location.reload(); }
        }
        renderRound();
    </script>
</body>
</html>
